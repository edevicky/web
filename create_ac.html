<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Brew Haven - Create Account</title>

	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
	<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">

	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; }
		html { scrollbar-width: none; -ms-overflow-style: none; }
		html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }

		body {
			font-family: 'Poppins', Arial, sans-serif;
			min-height: 100vh;
			overflow-x: hidden;
			color: #2b2018;
			background:
				radial-gradient(900px 520px at 90% -6%, rgba(240,165,0,.22), transparent 60%),
				radial-gradient(820px 520px at -5% 100%, rgba(196,107,0,.16), transparent 55%),
				linear-gradient(160deg, #fdf9f2, #f4e9d8 55%, #fdf9f2);
			background-attachment: fixed;
		}

		.bg-shapes { position: fixed; inset: 0; overflow: hidden; z-index: -1; pointer-events: none; }
		.bg-shapes span { position: absolute; display: block; opacity: .5; }
		.shape-circle { border-radius: 50%; background: radial-gradient(circle at 30% 30%, #ffdda0, #d98a00); animation: drift 9s ease-in-out infinite; }
		.shape-ring { border-radius: 50%; background: transparent; border: 16px solid rgba(217,138,0,.22); animation: drift 12s ease-in-out infinite reverse; }
		.shape-square { border-radius: 22px; background: linear-gradient(135deg, #ffe6b0, #d98a00); animation: spinFloat 14s ease-in-out infinite; }
		.shape-triangle { width: 0; height: 0; background: transparent; border-left: 58px solid transparent; border-right: 58px solid transparent; border-bottom: 100px solid rgba(138,75,18,.28); animation: drift 11s ease-in-out infinite; }
		.bg-shapes .s1 { width: 180px; height: 180px; top: 8%; right: -60px; }
		.bg-shapes .s2 { width: 130px; height: 130px; bottom: 8%; left: 6%; }
		.bg-shapes .s3 { width: 150px; height: 150px; top: 60%; right: 8%; }
		.bg-shapes .s4 { top: 16%; left: 12%; }
		@keyframes drift { 0%,100%{transform:translateY(0) rotate(0);} 50%{transform:translateY(-28px) rotate(10deg);} }
		@keyframes spinFloat { 0%,100%{transform:translateY(0) rotate(12deg);} 50%{transform:translateY(-22px) rotate(-8deg);} }

		.background {
			position: relative;
			display: flex;
			justify-content: center;
			align-items: center;
			min-height: 100vh;
			padding: 24px;
		}

		.box {
			position: relative;
			z-index: 1;
			display: flex;
			width: 940px;
			max-width: 100%;
			overflow: hidden;
			border-radius: 26px;
			border: 1px solid rgba(43,32,24,.08);
			background: rgba(255,255,255,.62);
			backdrop-filter: blur(18px);
			-webkit-backdrop-filter: blur(18px);
			box-shadow: 0 30px 70px rgba(120,80,30,.18);
		}

		.form-side { flex: 1 1 58%; padding: 40px 46px 34px; }

		.brand { display: flex; align-items: center; gap: 12px; }
		.brand .icon { font-size: 30px; color: #d98a00; filter: drop-shadow(0 4px 10px rgba(217,138,0,.4)); }

		h2 { font-family: 'Playfair Display', Georgia, serif; font-size: 30px; font-weight: 800; color: #2b2018; }
		h2 span { background: linear-gradient(90deg, #d98a00, #8a4b12); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }

		hr { border: none; height: 3px; margin: 16px 0 22px; border-radius: 3px; background: linear-gradient(90deg, #d98a00, #8a4b12, transparent); }

		.field { margin-bottom: 16px; }
		label { display: block; font-size: 14px; margin-bottom: 7px; color: #5b4a37; }

		.input-wrap { position: relative; }
		.input-wrap > i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #d98a00; font-size: 15px; pointer-events: none; }

		input {
			width: 100%;
			height: 48px;
			padding: 0 46px 0 44px;
			border: 2px solid rgba(43,32,24,.12);
			border-radius: 24px;
			font-size: 15px;
			font-family: inherit;
			color: #2b2018;
			background: rgba(255,255,255,.7);
			outline: none;
			transition: .35s;
		}
		input::placeholder { color: #a99a86; }
		input:focus { border-color: #d98a00; background: #fff; box-shadow: 0 0 18px rgba(217,138,0,.22); }

		.toggle-pass { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #8a7a66; font-size: 15px; cursor: pointer; }
		.toggle-pass:hover { color: #d98a00; }

		.btn {
			width: 100%;
			height: 50px;
			margin-top: 8px;
			border: none;
			border-radius: 24px;
			cursor: pointer;
			font-family: inherit;
			font-size: 16px;
			font-weight: 700;
			letter-spacing: 1px;
			color: #fff;
			background: linear-gradient(135deg, #d98a00, #8a4b12);
			box-shadow: 0 14px 28px rgba(217,138,0,.32);
			transition: .3s;
		}
		.btn:hover { filter: brightness(1.07); box-shadow: 0 18px 34px rgba(217,138,0,.42); }

		.login-link { display: block; text-align: center; margin-top: 16px; color: #8a7a66; font-size: 14px; }
		.login-link a { color: #b87000; font-weight: 600; }

		.image-side {
			flex: 1 1 42%;
			position: relative;
			display: flex;
			justify-content: center;
			align-items: center;
			overflow: hidden;
			padding: 30px;
			background:
				radial-gradient(circle at 60% 40%, rgba(240,165,0,.28), transparent 70%),
				linear-gradient(160deg, #f6ead6, #ecd9ba);
		}
		.image-side img { width: 82%; max-width: 300px; border-radius: 20px; box-shadow: 0 24px 50px rgba(120,80,30,.28); animation: floatImg 4.5s ease-in-out infinite; }
		@keyframes floatImg { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-14px);} }

		@media (max-width: 880px) {
			.box { flex-direction: column-reverse; width: 480px; }
			.image-side { padding: 24px 0; }
			.image-side img { max-width: 170px; }
			.form-side { padding: 32px 30px 30px; }
			h2 { font-size: 27px; }
		}

		@media (max-width: 520px) {
			.background { padding: 14px; }
			.box { width: 100%; border-radius: 18px; }
			.form-side { padding: 26px 20px 24px; }
			h2 { font-size: 24px; }
			input, .btn { height: 46px; }
		}
	</style>
</head>
<body>
	<div class="bg-shapes">
		<span class="shape-circle s1"></span>
		<span class="shape-ring s2"></span>
		<span class="shape-square s3"></span>
		<span class="shape-triangle s4"></span>
	</div>

	<div class="background">
		<div class="box">
			<div class="form-side">
				<div class="brand">
					<i class="fa-solid fa-mug-hot icon"></i>
					<h2>Brew <span>Haven</span></h2>
				</div>
				<hr>

				<div class="field">
					<label>Email</label>
					<div class="input-wrap">
						<i class="fa-solid fa-envelope"></i>
						<input type="email" id="email" placeholder="Enter email or mobile no." required>
					</div>
				</div>

				<div class="field">
					<label>Password</label>
					<div class="input-wrap">
						<i class="fa-solid fa-lock"></i>
						<input type="password" id="password" placeholder="Enter new password" required>
						<button type="button" class="toggle-pass" data-target="password"><i class="fa-solid fa-eye"></i></button>
					</div>
				</div>

				<div class="field">
					<label>Confirm Password</label>
					<div class="input-wrap">
						<i class="fa-solid fa-lock"></i>
						<input type="password" id="confirm" placeholder="Confirm password" required>
						<button type="button" class="toggle-pass" data-target="confirm"><i class="fa-solid fa-eye"></i></button>
					</div>
				</div>

				<button class="btn" onclick="login()">Create Account</button>
				<p class="login-link">Already have an account? <a href="login.html">Login</a></p>
			</div>

			<div class="image-side">
				<img src="brewhaven.png" alt="Brew Haven">
			</div>
		</div>
	</div>

	<script>
		document.querySelectorAll(".toggle-pass").forEach(function (btn) {
			btn.addEventListener("click", function () {
				var input = document.getElementById(btn.getAttribute("data-target"));
				var icon = btn.querySelector("i");
				if (input.type === "password") {
					input.type = "text";
					icon.classList.replace("fa-eye", "fa-eye-slash");
				} else {
					input.type = "password";
					icon.classList.replace("fa-eye-slash", "fa-eye");
				}
			});
		});

		function login() {
			var email = document.getElementById("email").value.trim();
			var password = document.getElementById("password").value;
			var confirm = document.getElementById("confirm").value;

			if (email === "" || password === "" || confirm === "") {
				alert("Please fill all fields.");
				return;
			}
			if (password !== confirm) {
				alert("Password and Confirm Password do not match.");
				return;
			}

			localStorage.setItem("email", email);
			localStorage.setItem("password", password);

			alert("Account Created Successfully!");
			window.location.href = "login.html";
		}
	</script>
</body>
</html>
