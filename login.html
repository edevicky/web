<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Brew Haven - Login</title>

	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
	<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">

	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; }
		html { scrollbar-width: none; -ms-overflow-style: none; }
		html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }

		body {
			font-family: 'Poppins', Arial, sans-serif;
			min-height: 100vh;
			overflow-x: hidden;
			color: #2b2018;
			background:
				radial-gradient(900px 520px at 90% -6%, rgba(240,165,0,.22), transparent 60%),
				radial-gradient(820px 520px at -5% 100%, rgba(196,107,0,.16), transparent 55%),
				linear-gradient(160deg, #fdf9f2, #f4e9d8 55%, #fdf9f2);
			background-attachment: fixed;
		}

		/* 2D background shapes */
		.bg-shapes { position: fixed; inset: 0; overflow: hidden; z-index: -1; pointer-events: none; }
		.bg-shapes span { position: absolute; display: block; opacity: .5; }
		.shape-circle { border-radius: 50%; background: radial-gradient(circle at 30% 30%, #ffdda0, #d98a00); animation: drift 9s ease-in-out infinite; }
		.shape-ring { border-radius: 50%; background: transparent; border: 16px solid rgba(217,138,0,.22); animation: drift 12s ease-in-out infinite reverse; }
		.shape-square { border-radius: 22px; background: linear-gradient(135deg, #ffe6b0, #d98a00); animation: spinFloat 14s ease-in-out infinite; }
		.shape-triangle { width: 0; height: 0; background: transparent; border-left: 58px solid transparent; border-right: 58px solid transparent; border-bottom: 100px solid rgba(138,75,18,.28); animation: drift 11s ease-in-out infinite; }
		.bg-shapes .s1 { width: 180px; height: 180px; top: 6%; left: -60px; }
		.bg-shapes .s2 { width: 130px; height: 130px; bottom: 10%; right: 6%; }
		.bg-shapes .s3 { width: 150px; height: 150px; top: 58%; left: 6%; }
		.bg-shapes .s4 { top: 16%; right: 16%; }
		@keyframes drift { 0%,100%{transform:translateY(0) rotate(0);} 50%{transform:translateY(-28px) rotate(10deg);} }
		@keyframes spinFloat { 0%,100%{transform:translateY(0) rotate(12deg);} 50%{transform:translateY(-22px) rotate(-8deg);} }

		.background {
			position: relative;
			display: flex;
			justify-content: center;
			align-items: center;
			min-height: 100vh;
			padding: 24px;
		}

		.login_body {
			position: relative;
			z-index: 1;
			display: flex;
			width: 920px;
			max-width: 100%;
			overflow: hidden;
			border-radius: 26px;
			border: 1px solid rgba(43,32,24,.08);
			background: rgba(255,255,255,.62);
			backdrop-filter: blur(18px);
			-webkit-backdrop-filter: blur(18px);
			box-shadow: 0 30px 70px rgba(120,80,30,.18);
		}

		.form-side { flex: 1 1 56%; padding: 46px 46px 34px; }

		.brand { display: flex; align-items: center; gap: 12px; }
		.brand .icon { font-size: 30px; color: #d98a00; filter: drop-shadow(0 4px 10px rgba(217,138,0,.4)); }

		h2 { font-family: 'Playfair Display', Georgia, serif; font-size: 32px; font-weight: 800; color: #2b2018; }
		h2 span { background: linear-gradient(90deg, #d98a00, #8a4b12); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }

		hr { border: none; height: 3px; margin: 18px 0 26px; border-radius: 3px; background: linear-gradient(90deg, #d98a00, #8a4b12, transparent); }

		.field { margin-bottom: 18px; }
		label { display: block; font-size: 14px; margin-bottom: 8px; color: #5b4a37; }

		.input-wrap { position: relative; }
		.input-wrap > i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #d98a00; font-size: 15px; pointer-events: none; }

		input {
			width: 100%;
			height: 50px;
			padding: 0 46px 0 44px;
			border: 2px solid rgba(43,32,24,.12);
			border-radius: 24px;
			font-size: 15.5px;
			font-family: inherit;
			color: #2b2018;
			background: rgba(255,255,255,.7);
			outline: none;
			transition: .35s;
		}
		input::placeholder { color: #a99a86; }
		input:focus { border-color: #d98a00; background: #fff; box-shadow: 0 0 18px rgba(217,138,0,.22); }

		.toggle-pass { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #8a7a66; font-size: 15px; cursor: pointer; }
		.toggle-pass:hover { color: #d98a00; }

		.links { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin: 4px 2px 22px; }
		.links a { color: #b87000; font-size: 13.5px; transition: .3s; }
		.links a:hover { color: #8a4b12; }

		.msg { display: none; margin-bottom: 16px; padding: 12px 16px; border-radius: 14px; font-size: 14px; font-weight: 500; text-align: center; }
		.msg.show { display: block; }
		.msg.error { background: rgba(211,51,51,.12); color: #b02024; border: 1px solid rgba(211,51,51,.3); }
		.msg.success { background: rgba(47,174,83,.12); color: #1e7e34; border: 1px solid rgba(47,174,83,.3); }

		button.login-btn {
			width: 100%;
			height: 50px;
			border: none;
			border-radius: 24px;
			cursor: pointer;
			font-family: inherit;
			font-size: 16px;
			font-weight: 700;
			letter-spacing: 1px;
			color: #fff;
			background: linear-gradient(135deg, #d98a00, #8a4b12);
			box-shadow: 0 14px 28px rgba(217,138,0,.32);
			transition: .3s;
		}
		button.login-btn:hover { filter: brightness(1.07); box-shadow: 0 18px 34px rgba(217,138,0,.42); }
		button.login-btn:active { filter: brightness(.96); }

		.back-link { display: block; text-align: center; margin-top: 18px; color: #8a7a66; font-size: 14px; transition: .3s; }
		.back-link:hover { color: #d98a00; }

		.image-side {
			flex: 1 1 44%;
			position: relative;
			display: flex;
			justify-content: center;
			align-items: center;
			overflow: hidden;
			padding: 30px;
			background:
				radial-gradient(circle at 60% 40%, rgba(240,165,0,.28), transparent 70%),
				linear-gradient(160deg, #f6ead6, #ecd9ba);
		}
		.image-side img {
			width: 82%;
			max-width: 300px;
			border-radius: 20px;
			box-shadow: 0 24px 50px rgba(120,80,30,.28);
			animation: floatImg 4.5s ease-in-out infinite;
		}
		@keyframes floatImg { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-14px);} }

		@media (max-width: 860px) {
			.login_body { flex-direction: column-reverse; width: 480px; }
			.image-side { padding: 26px 0; }
			.image-side img { max-width: 180px; }
			.form-side { padding: 36px 30px 30px; }
			h2 { font-size: 28px; }
		}

		@media (max-width: 520px) {
			.background { padding: 14px; }
			.login_body { width: 100%; border-radius: 18px; }
			.form-side { padding: 28px 20px 24px; }
			h2 { font-size: 25px; }
			.image-side img { max-width: 140px; }
			input, button.login-btn { height: 46px; }
		}
	</style>
</head>
<body>
	<div class="bg-shapes">
		<span class="shape-circle s1"></span>
		<span class="shape-ring s2"></span>
		<span class="shape-square s3"></span>
		<span class="shape-triangle s4"></span>
	</div>

	<div class="background">
		<div class="login_body">
			<div class="form-side">
				<div class="brand">
					<i class="fa-solid fa-mug-hot icon"></i>
					<h2>Brew <span>Haven</span></h2>
				</div>
				<hr>

				<div class="field">
					<label>User Name</label>
					<div class="input-wrap">
						<i class="fa-solid fa-user"></i>
						<input type="text" id="email" placeholder="Enter user name" autocomplete="username">
					</div>
				</div>

				<div class="field">
					<label>Password</label>
					<div class="input-wrap">
						<i class="fa-solid fa-lock"></i>
						<input type="password" id="password" placeholder="Enter password" autocomplete="current-password">
						<button type="button" class="toggle-pass" id="togglePass" aria-label="Show password">
							<i class="fa-solid fa-eye"></i>
						</button>
					</div>
				</div>

				<div class="links">
					<a href="create_ac.html">Create Account</a>
					<a href="forgot.html">Forgot password?</a>
				</div>

				<div class="msg" id="msg"></div>

				<button class="login-btn" onclick="login()">Login</button>
				<a class="back-link" href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
			</div>

			<div class="image-side">
				<img src="brewhaven.png" alt="Brew Haven">
			</div>
		</div>
	</div>

	<script>
		var togglePass = document.getElementById("togglePass");
		togglePass.addEventListener("click", function () {
			var pass = document.getElementById("password");
			var icon = togglePass.querySelector("i");
			if (pass.type === "password") {
				pass.type = "text";
				icon.classList.replace("fa-eye", "fa-eye-slash");
			} else {
				pass.type = "password";
				icon.classList.replace("fa-eye-slash", "fa-eye");
			}
		});

		function login() {
			var email = document.getElementById("email").value.trim();
			var password = document.getElementById("password").value;
			var savedEmail = localStorage.getItem("email");
			var savedPassword = localStorage.getItem("password");

			if (email === "" || password === "") { alert("Please fill all fields."); return; }

			if (email === savedEmail && password === savedPassword) {
				alert("Login Successful");
				window.location.href = "orders.html";
			} else {
				alert("Invalid Email or Password");
			}
		}

		document.getElementById("password").addEventListener("keydown", function (e) {
			if (e.key === "Enter") login();
		});
	</script>
</body>
</html>
