<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Brew Haven - Forgot Password</title>

	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
	<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">

	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; }

		body {
			font-family: 'Poppins', Arial, sans-serif;
			min-height: 100vh;
			overflow-x: hidden;
			color: #2b2018;
			background:
				radial-gradient(900px 520px at 8% 0%, rgba(240,165,0,.22), transparent 60%),
				radial-gradient(820px 520px at 100% 100%, rgba(196,107,0,.16), transparent 55%),
				linear-gradient(160deg, #fdf9f2, #f4e9d8 55%, #fdf9f2);
			background-attachment: fixed;
		}

		.bg-shapes { position: fixed; inset: 0; overflow: hidden; z-index: -1; pointer-events: none; }
		.bg-shapes span { position: absolute; display: block; opacity: .5; }
		.shape-circle { border-radius: 50%; background: radial-gradient(circle at 30% 30%, #ffdda0, #d98a00); animation: drift 9s ease-in-out infinite; }
		.shape-ring { border-radius: 50%; background: transparent; border: 16px solid rgba(217,138,0,.22); animation: drift 12s ease-in-out infinite reverse; }
		.shape-square { border-radius: 22px; background: linear-gradient(135deg, #ffe6b0, #d98a00); animation: spinFloat 14s ease-in-out infinite; }
		.shape-triangle { width: 0; height: 0; background: transparent; border-left: 58px solid transparent; border-right: 58px solid transparent; border-bottom: 100px solid rgba(138,75,18,.28); animation: drift 11s ease-in-out infinite; }
		.bg-shapes .s1 { width: 180px; height: 180px; top: 6%; left: -60px; }
		.bg-shapes .s2 { width: 130px; height: 130px; bottom: 10%; right: 6%; }
		.bg-shapes .s3 { width: 150px; height: 150px; top: 62%; left: 8%; }
		.bg-shapes .s4 { top: 18%; right: 14%; }
		@keyframes drift { 0%,100%{transform:translateY(0) rotate(0);} 50%{transform:translateY(-28px) rotate(10deg);} }
		@keyframes spinFloat { 0%,100%{transform:translateY(0) rotate(12deg);} 50%{transform:translateY(-22px) rotate(-8deg);} }

		.background {
			position: relative;
			display: flex;
			justify-content: center;
			align-items: center;
			min-height: 100vh;
			padding: 24px;
		}

		.box {
			position: relative;
			z-index: 1;
			width: 440px;
			max-width: 100%;
			padding: 38px 38px 32px;
			border-radius: 26px;
			border: 1px solid rgba(43,32,24,.08);
			background: rgba(255,255,255,.62);
			backdrop-filter: blur(18px);
			-webkit-backdrop-filter: blur(18px);
			box-shadow: 0 30px 70px rgba(120,80,30,.18);
		}

		.brand { display: flex; align-items: center; justify-content: center; gap: 12px; }
		.brand .icon { font-size: 28px; color: #d98a00; filter: drop-shadow(0 4px 10px rgba(217,138,0,.4)); }

		h2 { font-family: 'Playfair Display', Georgia, serif; font-size: 28px; font-weight: 800; color: #2b2018; text-align: center; }
		h2 span { background: linear-gradient(90deg, #d98a00, #8a4b12); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }

		.sub { text-align: center; color: #8a7a66; font-size: 13.5px; margin-top: 6px; }

		hr { border: none; height: 3px; margin: 16px 0 22px; border-radius: 3px; background: linear-gradient(90deg, transparent, #d98a00, transparent); }

		.field { margin-bottom: 16px; }
		label { display: block; font-size: 14px; margin-bottom: 7px; color: #5b4a37; }

		.input-wrap { position: relative; }
		.input-wrap > i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #d98a00; font-size: 15px; pointer-events: none; }

		input {
			width: 100%;
			height: 48px;
			padding: 0 46px 0 44px;
			border: 2px solid rgba(43,32,24,.12);
			border-radius: 24px;
			font-size: 15px;
			font-family: inherit;
			color: #2b2018;
			background: rgba(255,255,255,.7);
			outline: none;
			transition: .35s;
		}
		input::placeholder { color: #a99a86; }
		input:focus { border-color: #d98a00; background: #fff; box-shadow: 0 0 18px rgba(217,138,0,.22); }

		.toggle-pass { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #8a7a66; font-size: 15px; cursor: pointer; }
		.toggle-pass:hover { color: #d98a00; }

		button.reset-btn {
			width: 100%;
			height: 50px;
			margin-top: 6px;
			border: none;
			border-radius: 24px;
			cursor: pointer;
			font-family: inherit;
			font-size: 16px;
			font-weight: 700;
			letter-spacing: 1px;
			color: #fff;
			background: linear-gradient(135deg, #d98a00, #8a4b12);
			box-shadow: 0 14px 28px rgba(217,138,0,.32);
			transition: .3s;
		}
		button.reset-btn:hover { filter: brightness(1.07); box-shadow: 0 18px 34px rgba(217,138,0,.42); }

		.back-link { display: block; text-align: center; margin-top: 18px; color: #8a7a66; font-size: 14px; transition: .3s; }
		.back-link:hover { color: #d98a00; }

		@media (max-width: 480px) {
			.background { padding: 14px; }
			.box { padding: 28px 20px 24px; border-radius: 18px; }
			h2 { font-size: 24px; }
			input, button.reset-btn { height: 46px; }
		}
	</style>
</head>
<body>
	<div class="bg-shapes">
		<span class="shape-circle s1"></span>
		<span class="shape-ring s2"></span>
		<span class="shape-square s3"></span>
		<span class="shape-triangle s4"></span>
	</div>

	<div class="background">
		<div class="box">
			<div class="brand">
				<i class="fa-solid fa-mug-hot icon"></i>
				<h2>Brew <span>Haven</span></h2>
			</div>
			<p class="sub">Reset your account password</p>
			<hr>

			<div class="field">
				<label>Registered Email</label>
				<div class="input-wrap">
					<i class="fa-solid fa-envelope"></i>
					<input type="email" id="email" placeholder="Enter registered email">
				</div>
			</div>

			<div class="field">
				<label>New Password</label>
				<div class="input-wrap">
					<i class="fa-solid fa-lock"></i>
					<input type="password" id="newpass" placeholder="Enter new password">
					<button type="button" class="toggle-pass" data-target="newpass"><i class="fa-solid fa-eye"></i></button>
				</div>
			</div>

			<div class="field">
				<label>Confirm Password</label>
				<div class="input-wrap">
					<i class="fa-solid fa-lock"></i>
					<input type="password" id="confirmpass" placeholder="Confirm new password">
					<button type="button" class="toggle-pass" data-target="confirmpass"><i class="fa-solid fa-eye"></i></button>
				</div>
			</div>

			<button class="reset-btn" onclick="resetPassword()">Reset Password</button>
			<a class="back-link" href="login.html"><i class="fa-solid fa-arrow-left"></i> Back to Login</a>
		</div>
	</div>

	<script>
		document.querySelectorAll(".toggle-pass").forEach(function (btn) {
			btn.addEventListener("click", function () {
				var input = document.getElementById(btn.getAttribute("data-target"));
				var icon = btn.querySelector("i");
				if (input.type === "password") {
					input.type = "text";
					icon.classList.replace("fa-eye", "fa-eye-slash");
				} else {
					input.type = "password";
					icon.classList.replace("fa-eye-slash", "fa-eye");
				}
			});
		});

		function resetPassword() {
			var email = document.getElementById("email").value.trim();
			var newpass = document.getElementById("newpass").value;
			var confirmpass = document.getElementById("confirmpass").value;
			var savedEmail = localStorage.getItem("email");

			if (email === "" || newpass === "" || confirmpass === "") {
				alert("Please fill all fields.");
				return;
			}
			if (email !== savedEmail) {
				alert("This Email is not registered.");
				return;
			}
			if (newpass !== confirmpass) {
				alert("Password and Confirm Password do not match.");
				return;
			}

			localStorage.setItem("password", newpass);
			alert("Password Changed Successfully.");
			window.location.href = "login.html";
		}
	</script>
</body>
</html>
