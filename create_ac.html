<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>
		
	</title>
	<style>
		.back{
			background: linear-gradient(to top right,lightblue,red);
			width: 100%;
			height: 100%;
			display: flex;
			justify-content: center;
			align-items: center;
		}
		.box{
			background: white;
			height: 400px;
			width: 800px;
			border-radius: 10px;
			box-shadow: 2px 2px 30px black;
			display: flex;
			gap:10px;
			justify-content: center;
			align-items: center;
			border: 5px solid #69562D;

		}
		input{
			width: 250px;
			height: 40px;
			font-size: 15px;
/*			box-shadow: 3px 2px 10px black;*/
			border-radius: 10px;
			border: 2px solid lightgray;
			outline: none;
			margin-left: 10px;
		}
		input:focus{
			outline: 2px solid green;

		}
		
		}
		label{
			font-size: 18px;
		}
		.box-rl{
			height: 400px;
			width: 400px;
			background: lightseagreen;
		}
		.btn{
			background: #435EDE;
			color: white;
			height: 40px;
			width: 150px;
			border: 1px solid transparent;
			margin-left: 60px;
			margin-top: 30px;
			transition: 0.5s;
			cursor: pointer;
		}
		.btn:hover{
			transform: scale(1.1) translateY(10px);
		}
		span{
			color: orange;
		}
	</style>
</head>
<body>
	<div class="back">
		<div class="box">
		<div>
			<h2>Brew <span>Haven</span></h2>
			<hr color="black">
			<label>Enter Email:</label><br><input type="email" id="email" placeholder="Enter Email or Mobile No." required><br><br>
			<label>Password:</label><br><input type="Password" id="password" name="pass" placeholder="Enter new password" required><br><br>
			<label>Confirm Password:</label><br><input type="Password" id="confirm" name="pass" placeholder="Confirm password" required><br>
			<button class="btn" onclick="login()">login</button>
		</div>
		<div class="box-rl">
		<img src="brewhaven.png" width="400px" height="400px">
		</div>
		</div>
	</div>

	<script>

function login()
{
    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;
    let confirm = document.getElementById("confirm").value;

    if(email == "" || password == "" || confirm == "")
    {
        alert("Please fill all fields.");
        return;
    }

    if(password != confirm)
    {
        alert("Password and Confirm Password do not match.");
        return;
    }

    // Email aur Password save karega
    localStorage.setItem("email", email);
    localStorage.setItem("password", password);

    alert("Account Created Successfully!");

    // Login page khulega
    window.location.href = "login.html";
}

</script>
</body>
</html>
